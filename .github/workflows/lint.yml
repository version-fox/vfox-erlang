name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check .
      - uses: jdx/mise-action@v5
      - name: Check Lua with LuaLS
        run: mise x aqua:LuaLS/lua-language-server@3.19.1 -- lua-language-server --check . --checklevel=Warning

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache: false
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e
      - name: Run go vet
        run: go vet ./...
        working-directory: tests/e2e
      - name: Run go vet for the Windows suite
        run: GOOS=windows go vet ./...
        working-directory: tests/e2e

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.6
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actionlint 1.7.12 is built with Go 1.25 or later, and tests/e2e/go.mod asks for 1.24,
      # so this job pins a newer toolchain of its own.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub workflows
        run: actionlint
