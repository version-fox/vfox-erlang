name: Test Plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/e2e/go.mod
          cache: false
      # The Detect hook and `vfox link --detect` need vfox 1.1.0. The module proxy verifies the
      # module checksum, so the binary is built from the tagged source.
      - name: Install vfox 1.1.0
        run: |
          go install github.com/version-fox/vfox@v1.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Runs every tests/*_test.lua file in its own VM against the plugin's hooks.
      - name: Run the offline Lua hook tests with vfox
        run: vfox plugin test .
      - name: Run the Go harness unit tests
        run: go test -short ./...
        working-directory: tests/e2e
